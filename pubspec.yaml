name: kilocal_flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  bloc: ^9.2.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^6.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/postcard.png
    - assets/letter.png
    - assets/training.png
    - assets/alimentation.png
    - assets/wellness.png
    - assets/name_logo.png
    - assets/path_header_ellipse.svg
