name: kilocal_flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.7+7

environment:
  sdk: ^3.11.3

dependencies:
  bloc: ^9.2.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-beta.2
  flutter_svg: ^2.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  live_activities: ^2.4.9
  google_fonts: ^6.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.11.0
  # Imported directly to enable Vimeo fullscreen: the Android custom-view
  # handler and the WKWebView inline-playback params are platform-specific.
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.26.0
  retrofit: ^4.9.2
  toastification: ^3.2.0
  firebase_core: 4.9.0
  firebase_crashlytics: ^5.2.2
  firebase_analytics: ^12.4.1
  firebase_performance: ^0.11.4+1
  firebase_messaging: ^16.2.2
  audioplayers: ^6.5.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  package_info_plus: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4

# Local fork of live_activities 2.4.9 with one fix: the upstream iOS plugin has
# a trailing comma in a function call (LiveActivitiesPlugin.swift:234) that only
# compiles on Xcode 16.3+/Swift 6.1. We build on Xcode 16.2, so the override
# points at a patched copy in third_party/. Remove once upstream ships the fix.
dependency_overrides:
  live_activities:
    path: third_party/live_activities
  # Firebase is pinned to firebase_core 4.9.0 for Xcode 16.2 compatibility (see
  # firebase_setup docs / tech-debt note). Its native iOS pigeon sends 14
  # FirebaseOptions fields, but firebase_core_platform_interface 7.1.0 added a
  # 15th (recaptchaSiteKey) and its decoder reads result[14], causing a
  # RangeError at Firebase.initializeApp. Pin the platform interface to 7.0.1 so
  # the Dart decoder matches the native encoder. Remove together with the
  # Firebase pins when upgrading Xcode.
  firebase_core_platform_interface: 7.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/person/
    - assets/decorations/
    - assets/postcard.png
    - assets/letter.png
    - assets/training.png
    - assets/alimentation.png
    - assets/wellness.png
    - assets/name_logo.png
    - assets/kilokal.png
    - assets/goal.png
    - assets/diary.png
    - assets/mindfulness.png
    - assets/self_care.png
    - assets/lifestyle.png
    - assets/zen.png
    - assets/baf.png
    - assets/doctor.png
    - assets/drums.png
    - assets/path_header_ellipse.svg
    - assets/biotype_texts.json
    - assets/strumenti/
    - assets/audio/

# App launcher icon — kilocal logo (white) on brand red (#C7153B), matching the
# splash screen. Regenerate native icons with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/icon.png"
  # iOS: flatten alpha onto the brand background so no black corners appear.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#C7153B"
  # Android: legacy icon + adaptive icon (foreground logo over brand background).
  android: "ic_launcher"
  adaptive_icon_background: "#C7153B"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
