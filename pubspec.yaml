name: kilocal_flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  bloc: ^9.2.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_html: ^3.0.0-beta.2
  flutter_svg: ^2.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  live_activities: ^2.4.9
  google_fonts: ^6.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.11.0
  retrofit: ^4.9.2
  toastification: ^3.2.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  firebase_performance: ^0.11.4+3
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

# Local fork of live_activities 2.4.9 with one fix: the upstream iOS plugin has
# a trailing comma in a function call (LiveActivitiesPlugin.swift:234) that only
# compiles on Xcode 16.3+/Swift 6.1. We build on Xcode 16.2, so the override
# points at a patched copy in third_party/. Remove once upstream ships the fix.
dependency_overrides:
  live_activities:
    path: third_party/live_activities

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/person/
    - assets/decorations/
    - assets/postcard.png
    - assets/letter.png
    - assets/training.png
    - assets/alimentation.png
    - assets/wellness.png
    - assets/name_logo.png
    - assets/kilokal.png
    - assets/path_header_ellipse.svg
